<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Pruebas de asignaciones</title></head>
<body>
<pre id="result">Ejecutando pruebas...</pre>
<iframe id="app" title="Aplicación de prueba" hidden></iframe>
<script src="../backend/Code.gs"></script>
<script>
  const frame=document.getElementById('app');
  frame.srcdoc=`<!doctype html><html><body>
    <div id="loginView"><form id="loginForm"><input id="username"><input id="password"><button>Entrar</button></form><div id="loginError"></div></div>
    <div id="appView" class="hidden"><aside id="sidebar"><button id="closeMenuButton"></button><nav id="mainNav"></nav><span id="userName"></span><button id="profileButton"></button><button id="logoutButton"></button></aside>
    <button id="menuBackdrop"></button><button id="menuButton"></button><span id="activePeriodLabel"></span><h1 id="pageTitle"></h1><span id="connectionBadge"></span><div id="content"></div></div>
    <div id="modal" class="hidden"><h2 id="modalTitle"></h2><button id="modalClose"></button><div id="modalBody"></div></div><div id="toastRegion"></div>
    <script>
      const store=new Map();
      Object.defineProperty(window,'localStorage',{value:{getItem:key=>store.get(key)??null,setItem:(key,value)=>store.set(key,String(value)),removeItem:key=>store.delete(key)}});
    <\/script>
    <script src="../js/calculations.js"><\/script><script src="../js/api.js"><\/script>
    <script>window.API.isDemo=()=>true;<\/script>
    <script src="../js/auth.js"><\/script><script src="../js/csv.js"><\/script><script src="../js/rubric-default.js"><\/script>
    <script src="../js/admin.js"><\/script><script src="../js/evaluator.js"><\/script><script src="../js/reports.js"><\/script><script src="../js/app.js"><\/script>
  </body></html>`;
  function waitFor(predicate){
    return new Promise((resolve,reject)=>{
      const start=Date.now();
      const timer=setInterval(()=>{
        if(predicate()){clearInterval(timer);resolve();}
        else if(Date.now()-start>5000){clearInterval(timer);reject(new Error('Tiempo agotado esperando la aplicación'));}
      },20);
    });
  }
  frame.onload=async()=>{
    try{
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const w=frame.contentWindow,doc=frame.contentDocument;
      doc.getElementById('username').value='admin';
      doc.getElementById('password').value='admin123';
      doc.getElementById('loginForm').requestSubmit();
      await waitFor(()=>doc.querySelector('[data-view="assignments"]'));
      const data=await w.Admin.load();
      const dangerous='Texto "citado" <img src=x>';
      const studentForm=new DOMParser().parseFromString(w.Admin.studentForm(data,{thesis:dangerous}),'text/html');
      assert(studentForm.querySelector('[name="thesis"]').value===dangerous&&!studentForm.querySelector('img'),'El formulario no conserva y escapa el título');
      const dashboard=new DOMParser().parseFromString(w.Evaluator.dashboard({students:[{id:'S1',name:dangerous,thesis:dangerous}],completed:[],evaluations:[],period:{name:dangerous}}),'text/html');
      assert(!dashboard.querySelector('img')&&dashboard.querySelector('tbody').textContent.includes(dangerous),'La tabla del evaluador no escapa los datos');
      data.students.push({id:'EST-004',matricula:'999',name:'Estudiante nuevo',thesis:'Tesis <prueba>',director:'Director & asesor',period:data.period.id});
      data.evaluators.push({id:'EV-004',name:'Evaluador nuevo',username:'nuevo',state:'Activo'});
      data.assignments.push({id:'AS-10',student:'EST-004',evaluator:'EV-003',state:'Inactiva'});
      w.Admin.saveDemo(data);
      doc.querySelector('[data-view="assignments"]').click();
      await waitFor(()=>doc.querySelector('[data-edit-assignment="EST-004"]'));
      const row=doc.querySelector('[data-edit-assignment="EST-004"]').closest('tr');
      const headings=[...doc.querySelectorAll('#content table th')].map(th=>th.textContent);
      assert(headings.join('|')==='Matrícula|Estudiante|Título de tesis|Director // Codirector|Evaluadores|Avance|Acciones','Las columnas de asignaciones no están en el orden esperado');
      assert(row.cells[2].textContent==='Tesis <prueba>'&&row.cells[3].textContent==='Director & asesor'&&!row.cells[2].querySelector('prueba'),'No se muestran correctamente el título y el director');
      assert(row.textContent.includes('Sin asignar'),'Se mostró una asignación inactiva');
      row.querySelector('button').click();
      const checkbox=id=>doc.querySelector(`#assignmentForm [value="${id}"]`);
      checkbox('EV-001').click();
      doc.getElementById('assignmentForm').requestSubmit();
      await waitFor(()=>doc.getElementById('modal').classList.contains('hidden'));
      let saved=await w.Admin.load();
      assert(saved.assignments.some(a=>a.student==='EST-004'&&a.evaluator==='EV-001'&&a.state==='Activa'),'No se guardó una asignación parcial');
      const report=w.Reports.createReport({...saved,rubric:[]},'student',{studentId:'EST-004'});
      assert(report.html.includes(saved.evaluators[0].name)&&report.html.includes('Pendiente'),'El reporte no muestra la asignación parcial pendiente');
      saved.evaluations.push({student:'EST-004',evaluator:'EV-001',period:saved.period.id,round:2});
      w.Admin.saveDemo(saved);
      doc.querySelector('[data-view="assignments"]').click();
      await waitFor(()=>doc.querySelector('[data-edit-assignment="EST-004"]'));
      doc.querySelector('[data-edit-assignment="EST-004"]').click();
      assert(checkbox('EV-001').checked&&checkbox('EV-001').disabled,'No se protegió la evaluación enviada');
      checkbox('EV-002').click();checkbox('EV-003').click();checkbox('EV-004').click();
      assert(!checkbox('EV-004').checked,'Se permitieron más de tres evaluadores');
      doc.getElementById('assignmentForm').requestSubmit();
      await waitFor(()=>doc.getElementById('modal').classList.contains('hidden'));
      saved=await w.Admin.load();
      assert(saved.assignments.filter(a=>a.student==='EST-004'&&a.state==='Activa').length===3,'No se completó la asignación después de una evaluación');
      saved.students=[];w.Admin.saveDemo(saved);
      doc.querySelector('[data-view="assignments"]').click();
      await waitFor(()=>doc.getElementById('content').textContent.includes('No hay estudiantes en el periodo activo'));
      assert(doc.querySelector('#content .empty-row').colSpan===7,'El mensaje vacío no abarca todas las columnas');

      const headers=['Estado','ID_Evaluador','ID_Periodo','ID_Asignacion','Fecha_Asignacion','ID_Estudiante'];
      const rows=[headers];
      let serial=0,evaluations=[],failStateWrite=false;
      const evaluators=['E1','E2','E3','E4'].map(id=>({id,state:id==='E4'?'Inactivo':'Activo'}));
      window.dashboard=()=>({period:{id:'P1'},students:[{id:'S1'}],evaluators,
        assignments:rows.slice(1).map(r=>({state:r[0],evaluator:r[1],student:r[5]})),evaluations});
      window.sh=()=>({
        getDataRange:()=>({getValues:()=>rows.map(row=>row.slice())}),
        getLastRow:()=>rows.reduce((last,row,index)=>row.some(value=>value!=='')?index+1:last,0),
        getRange:(row,column,height=1,width=1)=>({
          setValue:value=>{rows[row-1][column-1]=value;if(failStateWrite){failStateWrite=false;throw new Error('Fallo simulado');}},
          getFormula:()=>'',getValues:()=>Array.from({length:height},(_,i)=>rows[row-1+i]?.slice(column-1,column-1+width)||Array(width).fill('')),
          getFormulas:()=>Array.from({length:height},()=>Array(width).fill('')),
          setValues:values=>{values.forEach((value,i)=>{rows[row-1+i]=value.slice();});},
          clearContent:()=>{for(let i=0;i<height;i++)rows[row-1+i]=Array(width).fill('');}
        })
      });
      window.SpreadsheetApp={flush:()=>{}};
      window.nextId=()=>`AS-${++serial}`;
      const rejects=(ids,message)=>{
        let failed=false;
        try{saveAssignment('S1',ids);}catch(error){failed=error.message.includes(message);}
        assert(failed,'Se esperaba el error: '+message);
      };
      saveAssignment('S1',['E1']);
      evaluations=[{student:'S1',evaluator:'E1'}];
      saveAssignment('S1',['E1','E2']);
      assert(rows.filter(r=>r[0]==='Activa').length===2,'El servidor no conservó la evaluación al agregar un evaluador');
      rejects(['E2'],'ya envió');
      rejects(['E1','E2','E3','E4'],'hasta tres');
      rejects(['E1','E1'],'diferentes');
      rejects(['E1','E4'],'no está disponible');
      saveAssignment('S1',['E1','E3']);
      assert(rows.some(r=>r[0]==='Inactiva'&&r[1]==='E2')&&rows.some(r=>r[0]==='Activa'&&r[1]==='E3'),'No se reemplazó el evaluador pendiente');
      assert(rows.some(r=>r[0]==='Activa'&&r[1]==='E1'),'Se alteró la asignación evaluada');
      failStateWrite=true;
      rejects(['E1','E2'],'Fallo simulado');
      assert(rows.some(r=>r[0]==='Activa'&&r[1]==='E3')&&!rows.some(r=>r[0]==='Activa'&&r[1]==='E2'),'No se restauraron las asignaciones tras un fallo');
      rejects([],'ya envió');
      evaluations=[];
      saveAssignment('S1',[]);
      assert(!rows.slice(1).some(r=>r[0]==='Activa'),'No se eliminaron las asignaciones pendientes');
      document.getElementById('result').textContent='Todas las pruebas de asignaciones pasaron.';
    }catch(error){document.getElementById('result').textContent='Error: '+error.message;console.error(error);}
  };
</script>
</body>
</html>
