<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Pruebas de importación CSV</title></head>
<body>
<pre id="result">Ejecutando pruebas...</pre>
<iframe id="app" title="Aplicación de prueba" hidden></iframe>
<script>
  const frame=document.getElementById('app');
  frame.srcdoc=`<!doctype html><html><body>
    <div id="loginView"><form id="loginForm"><input id="username"><input id="password"><button>Entrar</button></form><div id="loginError"></div></div>
    <div id="appView" class="hidden"><aside id="sidebar"><button id="closeMenuButton"></button><nav id="mainNav"></nav><span id="userName"></span><button id="profileButton"></button><button id="logoutButton"></button></aside>
    <button id="menuBackdrop"></button><button id="menuButton"></button><span id="activePeriodLabel"></span><h1 id="pageTitle"></h1><span id="connectionBadge"></span><div id="content"></div></div>
    <div id="modal" class="hidden"><h2 id="modalTitle"></h2><button id="modalClose"></button><div id="modalBody"></div></div><div id="toastRegion"></div>
    <script>
      const store=new Map();
      Object.defineProperty(window,'localStorage',{value:{getItem:key=>store.get(key)??null,setItem:(key,value)=>store.set(key,String(value)),removeItem:key=>store.delete(key)}});
    <\/script>
    <script src="../js/calculations.js"><\/script><script src="../js/api.js"><\/script>
    <script>window.API.isDemo=()=>true;<\/script>
    <script src="../js/auth.js"><\/script><script src="../js/csv.js"><\/script><script src="../js/rubric-default.js"><\/script>
    <script src="../js/admin.js"><\/script><script src="../js/evaluator.js"><\/script><script src="../js/reports.js"><\/script><script src="../js/app.js"><\/script>
  </body></html>`;
  function waitFor(predicate){
    return new Promise((resolve,reject)=>{
      const start=Date.now();
      const timer=setInterval(()=>{
        if(predicate()){clearInterval(timer);resolve();}
        else if(Date.now()-start>5000){clearInterval(timer);reject(new Error('Tiempo agotado esperando la aplicación'));}
      },20);
    });
  }
  frame.onload=async()=>{
    try{
      const w=frame.contentWindow,doc=frame.contentDocument;
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      doc.getElementById('username').value='admin';
      doc.getElementById('password').value='admin123';
      doc.getElementById('loginForm').requestSubmit();
      await waitFor(()=>doc.querySelector('[data-view="students"]'));
      const data=await w.Admin.load();
      data.students[0].matricula=12345;
      data.students[1].matricula='AbC9';
      data.students[2].matricula=98765;
      data.students[2].period='OTRA-COHORTE';
      w.Admin.saveDemo(data);
      doc.querySelector('[data-view="students"]').click();
      await waitFor(()=>doc.getElementById('importStudents'));
      doc.getElementById('importStudents').click();
      async function validate(matricula){
        const input=doc.getElementById('csvImportFile'),transfer=new w.DataTransfer();
        const csv=`Matrícula,Nombre,Programa,Semestre,Título de tesis,Director de tesis\n${matricula},Prueba,MCIE,1,Tesis,Director`;
        transfer.items.add(new w.File([csv],'prueba.csv',{type:'text/csv'}));
        input.files=transfer.files;
        doc.getElementById('csvImportStatus').textContent='Procesando...';
        input.dispatchEvent(new w.Event('change',{bubbles:true}));
        await waitFor(()=>doc.getElementById('csvImportStatus').textContent!=='Procesando...');
        return {enabled:!doc.getElementById('confirmCsvImport').disabled,error:doc.getElementById('csvImportErrors').textContent};
      }
      assert((await validate('998877')).enabled,'Se rechazó una matrícula nueva');
      const numeric=await validate('12345');
      assert(!numeric.enabled&&numeric.error.includes('ya existe'),'No se detectó una matrícula numérica duplicada');
      const text=await validate('aBc9');
      assert(!text.enabled&&text.error.includes('ya existe'),'No se detectó una matrícula de texto duplicada');
      assert((await validate('98765')).enabled,'Se rechazó una matrícula de otra cohorte');
      await validate('998877');
      doc.getElementById('confirmCsvImport').click();
      await waitFor(()=>doc.getElementById('modal').classList.contains('hidden'));
      assert((await w.Admin.load()).students.some(student=>student.matricula==='998877'),'No se guardó el estudiante importado');
      document.getElementById('result').textContent='Todas las pruebas de importación CSV pasaron.';
    }catch(error){document.getElementById('result').textContent='Error: '+error.message;console.error(error);}
  };
</script>
</body>
</html>
