<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Pruebas de importación CSV</title></head>
<body>
<pre id="result">Ejecutando pruebas...</pre>
<iframe id="app" title="Aplicación de prueba" hidden></iframe>
<script>
  const frame=document.getElementById('app');
  frame.srcdoc=`<!doctype html><html><body>
    <div id="loginView"><form id="loginForm"><input id="username"><input id="password"><button>Entrar</button></form><div id="loginError"></div></div>
    <div id="appView" class="hidden"><aside id="sidebar"><button id="closeMenuButton"></button><nav id="mainNav"></nav><span id="userName"></span><button id="profileButton"></button><button id="logoutButton"></button></aside>
    <button id="menuBackdrop"></button><button id="menuButton"></button><span id="activePeriodLabel"></span><h1 id="pageTitle"></h1><span id="connectionBadge"></span><div id="content"></div></div>
    <div id="modal" class="hidden"><h2 id="modalTitle"></h2><button id="modalClose"></button><div id="modalBody"></div></div><div id="toastRegion"></div>
    <script>
      const store=new Map();
      Object.defineProperty(window,'localStorage',{value:{getItem:key=>store.get(key)??null,setItem:(key,value)=>store.set(key,String(value)),removeItem:key=>store.delete(key)}});
    <\/script>
    <script src="../js/calculations.js"><\/script><script src="../js/api.js"><\/script>
    <script>window.API.isDemo=()=>true;<\/script>
    <script src="../js/auth.js"><\/script><script src="../js/csv.js"><\/script><script src="../js/rubric-default.js"><\/script>
    <script src="../js/admin.js"><\/script><script src="../js/evaluator.js"><\/script><script src="../js/reports.js"><\/script><script src="../js/app.js"><\/script>
  </body></html>`;
  function waitFor(predicate){
    return new Promise((resolve,reject)=>{
      const start=Date.now();
      const timer=setInterval(()=>{
        if(predicate()){clearInterval(timer);resolve();}
        else if(Date.now()-start>5000){clearInterval(timer);reject(new Error('Tiempo agotado esperando la aplicación'));}
      },20);
    });
  }
  frame.onload=async()=>{
    try{
      const w=frame.contentWindow,doc=frame.contentDocument;
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      doc.getElementById('username').value='admin';
      doc.getElementById('password').value='admin123';
      doc.getElementById('loginForm').requestSubmit();
      await waitFor(()=>doc.querySelector('[data-view="students"]'));
      const data=await w.Admin.load();
      data.students[0].matricula=12345;
      data.students[0].program='MCIE';
      data.students[0].thesis='Control, "análisis"\ny diseño';
      data.students[0].director='Pérez, Ana';
      data.students[1].matricula='AbC9';
      data.students[1].director='  Pérez, Ana // Dr. Otro  ';
      data.students[2].matricula=98765;
      data.students[2].director=' // Dr. Otro // ';
      data.students[2].period='OTRA-COHORTE';
      data.periods=[data.period,{id:'OTRA-COHORTE',name:'Otro periodo',state:'Inactivo'}];
      w.Admin.saveDemo(data);
      doc.querySelector('[data-view="students"]').click();
      await waitFor(()=>doc.getElementById('importStudents'));
      const directorFilter=doc.getElementById('studentDirector');
      const directors=[...directorFilter.options].map(option=>option.value);
      assert(directors.length===3&&directors.includes('Pérez, Ana')&&directors.includes('Dr. Otro'),'El filtro no separa y deduplica los directores');
      const visibleStudents=()=>[...doc.querySelectorAll('#studentRows tr[data-row-id]')].map(row=>row.dataset.rowId).sort().join('|');
      directorFilter.value='Pérez, Ana';directorFilter.dispatchEvent(new w.Event('change',{bubbles:true}));
      assert(visibleStudents()==='EST-001|EST-002','El filtro no incluye tanto al director individual como al de codirección');
      directorFilter.value='Dr. Otro';directorFilter.dispatchEvent(new w.Event('change',{bubbles:true}));
      assert(visibleStudents()==='EST-002|EST-003','El filtro no incluye al codirector');
      directorFilter.value='';directorFilter.dispatchEvent(new w.Event('change',{bubbles:true}));
      assert(visibleStudents()==='EST-001|EST-002|EST-003','El filtro no restaura todos los estudiantes');
      let downloaded,blob;
      w.URL.createObjectURL=value=>{blob=value;return 'blob:csv-test';};
      w.URL.revokeObjectURL=()=>{};
      w.HTMLAnchorElement.prototype.click=function(){downloaded={blob,filename:this.download};};
      doc.querySelector('#studentRows .row-select').click();
      doc.getElementById('exportStudents').click();
      const exported=await downloaded.blob.text(),exportedRows=w.Csv.parse(exported);
      assert(downloaded.filename==='estudiantes.csv'&&exportedRows[0][5]==='Director // Codirector'&&exportedRows[0][6]==='Periodo','La exportación no usa los encabezados esperados');
      assert(exported.includes('"Control, ""análisis""\ny diseño"')&&exportedRows[1][4]===data.students[0].thesis&&exportedRows[1][5]===data.students[0].director,'La exportación no conserva comas, comillas y saltos de línea');
      doc.getElementById('importStudents').click();
      doc.getElementById('downloadCsvTemplate').click();
      const templateHeaders=w.Csv.parse(await downloaded.blob.text())[0];
      assert(downloaded.filename==='students-plantilla.csv'&&templateHeaders[5]==='Director // Codirector'&&templateHeaders[6]==='Periodo','La plantilla no usa los encabezados esperados');
      async function validateCsv(csv){
        const input=doc.getElementById('csvImportFile'),transfer=new w.DataTransfer();
        transfer.items.add(new w.File([csv],'prueba.csv',{type:'text/csv'}));
        input.files=transfer.files;
        doc.getElementById('csvImportStatus').textContent='Procesando...';
        input.dispatchEvent(new w.Event('change',{bubbles:true}));
        await waitFor(()=>doc.getElementById('csvImportStatus').textContent!=='Procesando...');
        return {enabled:!doc.getElementById('confirmCsvImport').disabled,error:doc.getElementById('csvImportErrors').textContent};
      }
      async function validate(matricula,periodHeader='',periodValue=''){
        return validateCsv(`Matrícula,Nombre,Programa,Semestre,Título de tesis,Director de tesis${periodHeader?','+periodHeader:''}\n${matricula},Prueba,MCIE,1,Tesis,Director${periodHeader?','+periodValue:''}`);
      }
      const invalid=await validateCsv('Matrícula,Nombre,Programa,Semestre,Título de tesis,Director de tesis,Periodo\n998876,Prueba,MCIE,1,Tesis, con coma,Director,Otro periodo');
      assert(!invalid.enabled&&invalid.error.includes('más columnas')&&invalid.error.includes('comillas'),'No se detectó una coma sin escapar');
      assert((await validate('998877')).enabled,'Se rechazó una matrícula nueva');
      const numeric=await validate('12345');
      assert(!numeric.enabled&&numeric.error.includes('ya existe'),'No se detectó una matrícula numérica duplicada');
      const text=await validate('aBc9');
      assert(!text.enabled&&text.error.includes('ya existe'),'No se detectó una matrícula de texto duplicada');
      assert((await validate('98765')).enabled,'Se rechazó una matrícula de otra cohorte');
      for(const header of ['Generación / cohorte','Periodo']){
        const unknown=await validate('998877',header,'Periodo inexistente');
        assert(!unknown.enabled&&unknown.error.includes('Periodo inexistente'),`No se reconoció el encabezado ${header}`);
        assert((await validate('998877',header,'Otro periodo')).enabled,`Se rechazó el encabezado ${header}`);
      }
      doc.getElementById('confirmCsvImport').click();
      await waitFor(()=>doc.getElementById('modal').classList.contains('hidden'));
      assert((await w.Admin.load()).students.some(student=>student.matricula==='998877'&&student.period==='OTRA-COHORTE'),'No se guardó el estudiante con el periodo indicado');
      doc.querySelector('[data-view="students"]').click();
      await waitFor(()=>doc.getElementById('importStudents'));
      doc.getElementById('importStudents').click();
      assert((await validateCsv(exported.replace('12345','998878'))).enabled,'Se rechazó el CSV exportado con comas');
      doc.getElementById('confirmCsvImport').click();
      await waitFor(()=>doc.getElementById('modal').classList.contains('hidden'));
      const imported=(await w.Admin.load()).students.find(student=>student.matricula==='998878');
      assert(imported?.thesis===data.students[0].thesis&&imported.director===data.students[0].director,'La importación alteró los valores con comas o comillas');
      document.getElementById('result').textContent='Todas las pruebas de importación CSV pasaron.';
    }catch(error){document.getElementById('result').textContent='Error: '+error.message;console.error(error);}
  };
</script>
</body>
</html>
