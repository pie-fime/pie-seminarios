<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Pruebas de reportes</title></head>
<body>
<pre id="result">Ejecutando pruebas...</pre>
<script src="../js/calculations.js"></script>
<script src="../js/reports.js"></script>
<script>
  try{
    const data={
      period:{id:'P1',name:'Periodo'},
      students:[{id:'S1',matricula:'100',name:'Estudiante',period:'P1'}],
      evaluators:[{id:'E1',name:'Marta Ejemplo'},{id:'E2',name:'Dr. Luis Ejemplo'},{id:'E3',name:'Dra. Ana Ejemplo'}],
      assignments:['E1','E2','E3'].map(evaluator=>({student:'S1',evaluator,state:'Activa'})),
      evaluations:['E1','E2','E3'].map((evaluator,index)=>({student:'S1',evaluator,individual:[91.25,98.35,0][index],criteria:{C1:50},observations:'Comentario'})),
      rubric:[{id:'C1',name:'Criterio de prueba'}]
    };
    const report=Reports.createReport(data,'student',{studentId:'S1'});
    const doc=new DOMParser().parseFromString(report.html,'text/html');
    if(![...doc.querySelectorAll('.report-meta dt')].some(item=>item.textContent==='Director // Codirector')||
       !report.csvRows.some(row=>row[0]==='Director // Codirector'))
      throw new Error('El reporte individual no identifica al director y codirector');
    const comments=doc.querySelector('.report-comments').textContent;
    const commentsSection=doc.querySelector('.report-comments-section');
    const expected=['R1: Comentario','R2: Comentario','R3: Comentario'];
    const actual=report.csvRows.slice(-3).map(row=>row[0]);
    if(expected.some((comment,index)=>!comments.includes(comment))||
       actual.join('|')!=='Marta Ejemplo|Luis Ejemplo|Dra. Ana Ejemplo')
      throw new Error('Las etiquetas de comentarios o los nombres del CSV son incorrectos');
    if(comments.includes('\n'))throw new Error('Los comentarios deben mostrarse seguidos, sin saltos manuales de línea');
    if(doc.querySelector('.report-meta').textContent.includes('Evaluaciones recibidas'))
      throw new Error('El reporte individual no debe mostrar el conteo de evaluaciones');
    if(comments.includes('Dr. Luis Ejemplo')||comments.includes('Dr. Marta Ejemplo'))
      throw new Error('El reporte añadió o conservó Dr. en los comentarios');
    if(!doc.querySelector('thead').textContent.includes('Dr. Luis Ejemplo'))
      throw new Error('Se modificó el nombre en la tabla de criterios');
    if(doc.querySelector('tfoot'))throw new Error('El reporte no debe incluir una fila de promedios por revisor');
    const sparse=Reports.createReport({...data,evaluations:data.evaluations.map((evaluation,index)=>index===1?{...evaluation,observations:''}:evaluation)},'student',{studentId:'S1'});
    const sparseComments=new DOMParser().parseFromString(sparse.html,'text/html').querySelector('.report-comments').textContent;
    if(sparseComments!=='R1: Comentario R3: Comentario')
      throw new Error('Las etiquetas deben conservar el número de revisor cuando falta un comentario');
    const final=doc.querySelector('.report-final');
    if(!final.textContent.includes('63.20 / 100')||!commentsSection.querySelector('h3')||
       commentsSection.querySelector('h3').textContent!=='Comentarios de los revisores'||
       !(final.compareDocumentPosition(commentsSection)&Node.DOCUMENT_POSITION_FOLLOWING)||
       !(doc.querySelector('.table-wrap').compareDocumentPosition(final)&Node.DOCUMENT_POSITION_FOLLOWING))
      throw new Error('La calificación final debe ir arriba del encabezado de comentarios');
    const criterionIndex=report.csvRows.findIndex(row=>row[0]==='Criterio de prueba');
    if(report.csvRows[criterionIndex+1][0]!=='Calificación final'||report.csvRows[criterionIndex+1][1]!=='63.20')
      throw new Error('El CSV no muestra la calificación final después de los criterios');
    const partial=Reports.createReport({...data,evaluations:data.evaluations.slice(0,2)},'student',{studentId:'S1'});
    const partialDoc=new DOMParser().parseFromString(partial.html,'text/html');
    if(!partialDoc.querySelector('.report-final').textContent.includes('Pendiente'))
      throw new Error('El reporte incompleto debe mostrar las calificaciones pendientes');
    const invalid=Reports.createReport({...data,evaluations:data.evaluations.map((evaluation,index)=>index===2?{...evaluation,individual:''}:evaluation)},'student',{studentId:'S1'});
    const invalidDoc=new DOMParser().parseFromString(invalid.html,'text/html');
    if(!invalidDoc.querySelector('.report-final').textContent.includes('Pendiente'))
      throw new Error('Una calificación vacía no debe calcularse como cero');
    window.Admin={formatDate:value=>value||'—'};
    const directory={
      ...data,
      students:[
        {...data.students[0],semester:2,program:'MCIE'},
        {id:'S2',matricula:'200',name:'Otro estudiante',semester:'2',program:'DIE',period:'P1'},
        {id:'S3',matricula:'300',name:'Tercer estudiante',semester:3,program:'MCIE',period:'P1'}
      ],
      assignments:[...data.assignments,{student:'S2',evaluator:'E1',state:'Activa'}],
      evaluations:[...data.evaluations,{student:'S2',evaluator:'E1',individual:0}]
    };
    const workspace=new DOMParser().parseFromString(Reports.workspace(directory),'text/html');
    if(!workspace.querySelector('#reportSemester option[value="2"]')||!workspace.querySelector('#reportProgram option[value="DIE"]'))
      throw new Error('Faltan opciones de semestre o programa');
    if(!workspace.querySelector('#reportType option[value="assignments"]'))
      throw new Error('Falta el reporte de asignaciones');
    const assignmentsData={...directory,students:[
      {...directory.students[0],thesis:'Tesis <prueba>',director:'Director & asesor'},
      {...directory.students[2],program:''}
    ],assignments:[...directory.assignments,{student:'S1',evaluator:'E2',state:'Inactiva'}]};
    const assignmentReport=Reports.createReport(assignmentsData,'assignments');
    const assignmentDoc=new DOMParser().parseFromString(assignmentReport.html,'text/html');
    const assignmentHeaders=[...assignmentDoc.querySelectorAll('thead th')].map(cell=>cell.textContent);
    const assignmentRows=[...assignmentDoc.querySelectorAll('tbody tr')];
    if(assignmentHeaders.join('|')!=='Matrícula|Estudiante|Programa|Título de tesis|Director // Codirector|Evaluadores'||
       assignmentRows.length!==2||assignmentRows[0].cells[3].textContent!=='Tesis <prueba>'||
       assignmentRows[0].cells[3].querySelector('prueba')||assignmentRows[0].cells[4].textContent!=='Director & asesor'||
       assignmentRows[0].cells[5].textContent!=='Marta EjemploDr. Luis EjemploDra. Ana Ejemplo'||
       assignmentRows[1].cells[2].textContent!=='Sin asignar'||assignmentRows[1].cells[5].textContent!=='Sin asignar')
      throw new Error('El reporte de asignaciones tiene datos o columnas incorrectos');
    if(assignmentReport.csvRows[2].join('|')!==assignmentHeaders.join('|')||
       assignmentReport.csvRows[3][5]!=='Marta Ejemplo\nDr. Luis Ejemplo\nDra. Ana Ejemplo')
      throw new Error('El CSV de asignaciones no coincide con el reporte');
    const emptyAssignments=new DOMParser().parseFromString(Reports.createReport({...assignmentsData,students:[]},'assignments').html,'text/html');
    if(emptyAssignments.querySelector('tbody td').colSpan!==6||!emptyAssignments.querySelector('tbody').textContent.includes('No hay estudiantes'))
      throw new Error('El reporte de asignaciones no muestra el periodo vacío');
    const periodReport=Reports.createReport(directory,'generation',{semester:'2',program:'MCIE'});
    const periodDoc=new DOMParser().parseFromString(periodReport.html,'text/html');
    const periodHeaders=[...periodDoc.querySelectorAll('thead th')].map(cell=>cell.textContent);
    const periodCells=[...periodDoc.querySelectorAll('tbody tr:first-child td')].map(cell=>cell.textContent);
    if(periodDoc.querySelector('h2').textContent!=='Reportes por periodo de evaluación'||
       periodHeaders.join('|')!=='Matrícula|Nombre del alumno|Semestre|Programa|Calificación final (0–100)'||
       periodDoc.querySelectorAll('tbody tr').length!==1||periodCells.join('|')!=='100|Estudiante|2|MCIE|63.20')
      throw new Error('El reporte por periodo tiene columnas, filtros o valores incorrectos');
    const periodHeaderIndex=periodReport.csvRows.findIndex(row=>row[0]==='Matrícula'&&row.length===5);
    if(periodReport.csvRows[periodHeaderIndex].join('|')!=='Matrícula|Nombre del alumno|Semestre|Programa|Calificación final (0-100)'||
       periodReport.csvRows[periodHeaderIndex+1].join('|')!=='100|Estudiante|2|MCIE|63.20'||
       periodReport.csvRows.length!==periodHeaderIndex+2)
      throw new Error('El CSV por periodo no coincide con los filtros y columnas');
    const allPeriods=new DOMParser().parseFromString(Reports.createReport(directory,'generation').html,'text/html');
    const semesterOnly=new DOMParser().parseFromString(Reports.createReport(directory,'generation',{semester:'2'}).html,'text/html');
    if(allPeriods.querySelectorAll('tbody tr').length!==3||semesterOnly.querySelectorAll('tbody tr').length!==2)
      throw new Error('El filtro de semestre o la selección de todos es incorrecta');
    const reviewerReport=Reports.createReport(directory,'evaluator',{evaluatorId:'E1',semester:'2',program:'DIE'});
    const reviewerDoc=new DOMParser().parseFromString(reviewerReport.html,'text/html');
    const reviewerHeaders=[...reviewerDoc.querySelectorAll('thead th')].map(cell=>cell.textContent);
    const reviewerCells=[...reviewerDoc.querySelectorAll('tbody tr:first-child td')].map(cell=>cell.textContent);
    if(reviewerHeaders.join('|')!=='Periodo|Matrícula|Nombre del alumno|Semestre|Programa|Calificación del revisor (0–100)'||
       reviewerDoc.querySelectorAll('tbody tr').length!==1||reviewerCells.join('|')!=='Periodo|200|Otro estudiante|2|DIE|0.00')
      throw new Error('El reporte por revisor tiene columnas, filtros o valores incorrectos');
    const reviewerHeaderIndex=reviewerReport.csvRows.findIndex(row=>row[0]==='Periodo'&&row.length===6);
    if(reviewerReport.csvRows[reviewerHeaderIndex].join('|')!=='Periodo|Matrícula|Nombre del alumno|Semestre|Programa|Calificación del revisor (0-100)'||
       reviewerReport.csvRows[reviewerHeaderIndex+1].join('|')!=='Periodo|200|Otro estudiante|2|DIE|0.00'||
       reviewerReport.csvRows.length!==reviewerHeaderIndex+2)
      throw new Error('El CSV por revisor no coincide con los filtros y columnas');
    const empty=Reports.createReport(directory,'evaluator',{evaluatorId:'E1',semester:'3',program:'MCIE'});
    const emptyDoc=new DOMParser().parseFromString(empty.html,'text/html');
    if(emptyDoc.querySelector('tbody td').colSpan!==6||!emptyDoc.querySelector('tbody').textContent.includes('No hay alumnos'))
      throw new Error('El reporte no indica cuando los filtros no tienen resultados');
    const assignedCount=[...emptyDoc.querySelectorAll('dt')].find(item=>item.textContent==='Alumnos asignados');
    if(assignedCount.nextElementSibling.textContent!=='0')throw new Error('El conteo filtrado debe mostrar cero');
    document.getElementById('result').textContent='Todas las pruebas de reportes pasaron.';
  }catch(error){document.getElementById('result').textContent='Error: '+error.message;console.error(error);}
</script>
</body>
</html>
